# CustomScale - New Partner App

client_id = "a2c4b4311f03178e0187dac2582e7cb4"
name = "CustomScale-app"
application_url = "https://highquality-image.highqualitytransfers.com"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-10"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks/app/uninstalled"

[[webhooks.subscriptions]]
topics = ["orders/create"]
uri = "/backend/webhooks/orders/create"

[[webhooks.subscriptions]]
topics = ["app/scopes_update"]
uri = "/webhooks/app/scopes_update"

[access_scopes]
scopes = "read_orders,read_products,write_products,write_app_proxy"

[auth]
redirect_urls = [ "https://highquality-image.highqualitytransfers.com/backend/auth/callback" ]

[app_proxy]
url = "https://highquality-image.highqualitytransfers.com/api"
subpath = "customscale-app"
prefix = "apps"

